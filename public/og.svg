<text x="316" y="206" font-family="Inter" font-size="94" font-weight="700" letter-spacing="-3" fill="#fafafa">ReadMe <tspan fill="#a5b4fc">Buddy</tspan></text>
<text x="318" y="266" font-family="Inter" font-size="32" fill="#8b8a99">Build READMEs worth reading — in blocks, not by hand.</text>
<text x="114" y="368" font-family="Inter" font-size="28" font-weight="500" fill="#e4e4e7">Compose → preview like github.com → export Markdown.</text>
<text x="114" y="408" font-family="Inter" font-size="22" fill="#71717a">Runs entirely in your browser. No backend, no account, nothing to install.</text>
