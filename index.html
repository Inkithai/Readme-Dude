<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="ReadMe Buddy — a visual GitHub README builder. Compose blocks, control the layout, preview like GitHub, export Markdown. Runs entirely in your browser."
    />
    <title>ReadMe Buddy — visual README builder</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReadMe Buddy" />
    <meta property="og:title" content="ReadMe Buddy — visual README builder" />
    <meta
      property="og:description"
      content="Compose blocks, preview like github.com, export Markdown. No backend, no account — your document stays in your browser."
    />
    <!-- Root-relative on purpose: main.tsx rewrites this to an absolute URL so it
         also resolves when the app is served from a subpath (GitHub Pages). -->
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>ReadMe Buddy is a client-side app — please enable JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
